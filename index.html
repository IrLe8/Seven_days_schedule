<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь событий</title>
  <!-- Подключаем внешние стили CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calendar-container">
    <div class="calendar-header">
      <button id="prevBtn">← Прошлый</button>
      <h2 id="monthTitle">Месяц Год</h2>
      <button id="nextBtn">Следующий →</button>
    </div>
    
    <div class="calendar-grid" id="calendarGrid">
      <!-- Сетка сгенерируется через script.js -->
    </div>
  </div>

  <!-- Модальное окно для деталей занятия -->
  <div id="eventModal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h2 id="modalTitle">Название занятия</h2>
      <div class="modal-body">
        <p><strong>Дата:</strong> <span id="modalDate"></span></p>
        <p><strong>Время:</strong> <span id="modalTimeRange"></span></p>
      </div>
    </div>
  </div>


  <!-- Подключаем логику JavaScript в самом конце body -->
  <script src="script.js"></script>
</body>
</html>
