<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь событий студии</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calendar-container">
    <div class="calendar-header">
      <button id="prevBtn">← Прошлый</button>
      <h2 id="monthTitle">Месяц Год</h2>
      <button id="nextBtn">Следующий →</button>
    </div>
    
    <!-- Место для вывода уведомления о создании нового листа таблицы -->
    <div id="statusMessage" class="status-message"></div>
    
    <div class="calendar-grid" id="calendarGrid">
      <!-- Сетка дней генерируется автоматически через скрипт -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
