<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь событий</title>
  <!-- Подключаем внешние стили CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calendar-container">
  <div class="calendar-header">
    <button id="prevBtn">← Прошлый</button>
    <h2 id="monthTitle">Месяц Год</h2>
    <button id="nextBtn">Следующий →</button>
  </div>
  
  <!-- Сюда скрипт выведет сообщение, если листа для месяца нет -->
  <div id="calendarNotification" class="calendar-notification"></div>
  
  <div class="calendar-grid" id="calendarGrid">
    <!-- Сетка сгенерируется через script.js -->
  </div>
</div>

</body>
</html>
