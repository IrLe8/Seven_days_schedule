<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Календарь из Google Таблиц</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; padding: 20px; }
    .calendar-container { width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    /* Шапка с кнопками */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .calendar-header button { padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: white; border-radius: 6px; }
    .calendar-header button:hover { background: #f0f0f0; }
    .calendar-header h2 { margin: 0; text-transform: capitalize; }

    /* Сетка календаря */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #e0e0e0; border: 1px solid #e0e0e0; }
    
    /* Дни недели */
    .day-name { background: #f8f9fa; padding: 10px; text-align: center; font-weight: bold; font-size: 14px; color: #555; }
    
    /* Ячейки дней */
    .day-cell { background: white; min-height: 100px; padding: 6px; display: flex; flex-direction: column; justify-content: flex-start; }
    .day-cell.empty { background: #fafafa; } /* Дни чужого месяца */
    .day-number { font-weight: bold; margin-bottom: 6px; color: #333; }
    
    /* Список событий внутри дня (строки событий) */
    .event-list { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .event-item { background: #e3f2fd; color: #0d47a1; font-size: 12px; padding: 4px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid #1976d2; }
  </style>
</head>
<body>

<div class="calendar-container">
  <div class="calendar-header">
    <button id="prevBtn">← Прошлый</button>
    <h2 id="monthTitle">Месяц Год</h2>
    <button id="nextBtn">Следующий →</button>
  </div>
  
  <div class="calendar-grid" id="calendarGrid">
    <!-- Сетка сгенерируется через JS -->
  </div>
</div>

<script>
  // 1. Вставьте сюда вашу опубликованную CSV ссылку
  const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0kuJR4SlQqXz7Dwoi9FB9_EY3htkgkF-dYnrtZ-3fwRXsgozUOGoDowse7cYenNfFHSU9YV2FEVkZ/pub?gid=590384500&single=true&output=csv"; 
  
  let allEvents = [];
  // Фиксируем текущую дату (2026 год согласно системному времени)
  let currentDate = new Date(); 

  // Загрузка данных
  async function fetchEvents() {
    try {
      const response = await fetch(csvUrl);
      const text = await response.text();
      const lines = text.split('\n');
      
      allEvents = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const cols = lines[i].split(',');
        if (cols.length >= 2) {
          allEvents.push({
            title: cols[0].replace(/^"|"$/g, '').trim(),
            start: cols[1].replace(/^"|"$/g, '').trim().split('T')[0] // только YYYY-MM-DD
          });
        }
      }
      renderCalendar();
    } catch (e) {
      console.error("Ошибка загрузки:", e);
      renderCalendar(); // Отрендерит пустой календарь, если таблица не загрузилась
    }
  }

  // Отрисовка
  function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    const title = document.getElementById('monthTitle');
    grid.innerHTML = ''; // Очищаем прошлый контент страницы

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth(); // 0 = Январь, 11 = Декабрь

    // Выводим название текущего месяца на экран
    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
    title.innerText = `${monthNames[month]} ${year}`;

    // Рендерим шапку дней недели
    const weekDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    weekDays.forEach(day => {
      grid.innerHTML += `<div class="day-name">${day}</div>`;
    });

    // Расчет дней
    const firstDayIndex = new Date(year, month, 1).getDay(); 
    // Корректируем индекс под русский календарь (где Пн = 0, а Вс = 6)
    const startOffset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
    
    const totalDays = new Date(year, month + 1, 0).getDate(); // Количество дней в месяце

    // 1. Отрисовка пустых ячеек (прошлый месяц)
    for (let i = 0; i < startOffset; i++) {
      grid.innerHTML += `<div class="day-cell empty"></div>`;
    }

    // 2. Отрисовка реальных дней месяца
    for (let day = 1; day <= totalDays; day++) {
      // Форматируем дату дня для поиска совпадений с базой данных
      const currentFullDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      
      // Ищем события на этот день
      const dayEvents = allEvents.filter(e => e.start === currentFullDate);
      
      // Генерируем строки событий для вставки во внутрений список дня
      let eventsHTML = '';
      dayEvents.forEach(ev => {
        eventsHTML += `<div class="event-item" title="${ev.title}">${ev.title}</div>`;
      });

      // Добавляем полноценный день в сетку
      grid.innerHTML += `
        <div class="day-cell">
          <div class="day-number">${day}</div>
          <div class="event-list">${eventsHTML}</div>
        </div>
      `;
    }
  }

  // Логика переключения кнопками (просто меняем объект даты на +/- 1 месяц)
  document.getElementById('prevBtn').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  // Запуск при старте страницы
  fetchEvents();
</script>
</body>
</html>
